name: Docker Compose Smoke CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".github/workflows/docker-compose-smoke-ci.yml"
  push:
    branches:
      - main
      - jianda
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".github/workflows/docker-compose-smoke-ci.yml"

jobs:
  smoke:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Pull service images
        run: |
          pull_with_retry() {
            service="$1"

            for attempt in 1 2 3; do
              if docker compose -f docker-compose.ci.yml pull "$service"; then
                return 0
              fi

              if [ "$attempt" -eq 3 ]; then
                return 1
              fi

              sleep $((attempt * 10))
            done
          }

          pull_with_retry postgres

      - name: Start backend stack
        run: docker compose -f docker-compose.ci.yml up -d postgres backend

      - name: Wait for backend health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:15000/health; then
              exit 0
            fi

            sleep 3
          done

          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs backend
          exit 1

      - name: Check database readiness
        run: curl -fsS http://localhost:15000/health/ready

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - jianda
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/dineflow-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and developer machines cannot drift apart.
          node-version-file: frontend/dineflow-web/.nvmrc
          cache: npm
          cache-dependency-path: frontend/dineflow-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Each check runs even when an earlier one fails, so a red build reports every problem
      # at once instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint -- --max-warnings 0

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # A budget, not a warning. Vite warned about the 1.9 MB entry bundle on every build for
      # months and shipped it anyway; raising the limit is now a decision that shows up in a diff.
      - name: Check bundle budget
        if: ${{ !cancelled() }}
        run: npm run bundle-budget

      # Production dependencies only: a vulnerability in a build tool does not ship to customers,
      # and gating on it would block unrelated work. Dev advisories are reported, not enforced.
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      - name: Report dev dependency advisories
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/dineflow-web/test-results/
          if-no-files-found: warn

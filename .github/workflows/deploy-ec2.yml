name: Deploy to EC2 (single-host)

# Deploys the whole stack (Postgres + backend + nginx frontend + cloudflared)
# to one EC2 host via SSH, using docker-compose.prod.yml. This is the low-cost
# replacement for the ECS/CloudFront pipelines (backend-cd.yml / frontend-cd.yml).
#
# Manual by default. To auto-deploy on push, uncomment the `push:` block below
# AFTER you have retired the ECS/CloudFront workflows so they don't both run.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST            public IP or hostname of the instance
#   EC2_USER            ssh user (e.g. ubuntu)
#   EC2_SSH_KEY         private key (PEM) for that user
#   EC2_APP_DIR         absolute path to the checked-out repo on the instance
#                       (e.g. /home/ubuntu/Smart Restaurant Ordering System)

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH build & up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.EC2_APP_DIR }}"
            echo "==> Pulling latest code"
            git fetch --all --prune
            git reset --hard origin/${{ github.ref_name }}
            echo "==> Building & starting stack"
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans
            echo "==> Pruning old images"
            docker image prune -f
            echo "==> Waiting for backend health"
            for i in $(seq 1 30); do
              if docker exec dineflow-backend curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
                echo "backend healthy"; break
              fi
              if [ "$i" = "30" ]; then echo "backend did not become healthy"; docker compose -f docker-compose.prod.yml logs --tail=80 backend; exit 1; fi
              sleep 5
            done
            docker compose -f docker-compose.prod.yml ps

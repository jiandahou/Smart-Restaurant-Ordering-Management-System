services:
  postgres:
    image: postgres:16
    container_name: dineflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dineflow_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dineflow_password}
      POSTGRES_DB: dineflow_db
    ports:
      - "5433:5432"
    volumes:
      - dineflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineflow_user -d dineflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dineflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dineflow_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9000/minio/health/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: dineflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AVATAR_STORAGE_BUCKET: ${AVATAR_STORAGE_BUCKET:-dineflow-avatars-local}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$AVATAR_STORAGE_BUCKET &&
      mc anonymous set download local/$$AVATAR_STORAGE_BUCKET
      "
    restart: "no"

  backend:
    build:
      context: ./backend/dineflow
      dockerfile: DineFlow.Api/Dockerfile
    container_name: dineflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dineflow_db;Username=dineflow_user;Password=${POSTGRES_PASSWORD:-dineflow_password}
      Jwt__Issuer: ${JWT_ISSUER:-DineFlow.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-DineFlow.Client}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required. Set it in a local .env file.}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-90}
      Email__From: ${AUTH_EMAIL_FROM:-noreply@theunknownfish.com}
      Email__Server: ${EMAIL_SERVER:-}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@theunknownfish.com}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-noreply@theunknownfish.com}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Google__CallbackPath: ${GOOGLE_CALLBACK_PATH:-/api/auth/google/signin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_PATH: ${GOOGLE_CALLBACK_PATH:-/api/auth/google/signin}
      Passkeys__ServerDomain: ${PASSKEY_SERVER_DOMAIN:-localhost}
      Passkeys__ServerName: ${PASSKEY_SERVER_NAME:-DineFlow}
      Passkeys__Origins__0: ${PASSKEY_ORIGINS:-http://localhost:5173}
      PASSKEY_SERVER_DOMAIN: ${PASSKEY_SERVER_DOMAIN:-localhost}
      PASSKEY_SERVER_NAME: ${PASSKEY_SERVER_NAME:-DineFlow}
      PASSKEY_ORIGINS: ${PASSKEY_ORIGINS:-http://localhost:5173}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__Currency: ${STRIPE_CURRENCY:-aud}
      Stripe__SuccessUrl: ${STRIPE_SUCCESS_URL:-http://localhost:5173/payment/success}
      Stripe__CancelUrl: ${STRIPE_CANCEL_URL:-http://localhost:5173/payment/cancelled}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-aud}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/payment/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/payment/cancelled}
      AvatarStorage__Provider: ${AVATAR_STORAGE_PROVIDER:-S3}
      AvatarStorage__Bucket: ${AVATAR_STORAGE_BUCKET:-dineflow-avatars-local}
      AvatarStorage__Region: ${AVATAR_STORAGE_REGION:-ap-southeast-2}
      AvatarStorage__ServiceUrl: ${AVATAR_STORAGE_SERVICE_URL:-http://minio:9000}
      AvatarStorage__UploadBaseUrl: ${AVATAR_STORAGE_UPLOAD_BASE_URL:-http://localhost:9000}
      AvatarStorage__PublicBaseUrl: ${AVATAR_STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/dineflow-avatars-local}
      AvatarStorage__ForcePathStyle: ${AVATAR_STORAGE_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      SeedOwner__Email: ${SEED_OWNER_EMAIL:-owner@dineflow.com}
      SeedOwner__Password: ${SEED_OWNER_PASSWORD:-ChangeMe123!}
      SeedOwner__FullName: ${SEED_OWNER_FULL_NAME:-DineFlow Owner}
      QzPrint__CertificatePemBase64: ${QZ_CERT_PEM_B64:-}
      QzPrint__PrivateKeyPemBase64: ${QZ_PRIVATE_KEY_PEM_B64:-}
    ports:
      - "5000:8080"
    volumes:
      - dineflow_backend_uploads:/app/wwwroot/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend/dineflow-web
      dockerfile: Dockerfile
    container_name: dineflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/dineflow-web:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

volumes:
  dineflow_postgres_data:
  dineflow_backend_uploads:
  dineflow_minio_data:

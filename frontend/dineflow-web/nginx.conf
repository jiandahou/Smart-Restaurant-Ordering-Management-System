# DineFlow frontend (production) — serves the built SPA and reverse-proxies
# API / health / uploads / SignalR to the backend container on the compose network.
#
# The container name "backend" resolves via Docker's internal DNS; the .NET API
# listens on :8080 (ASPNETCORE_URLS=http://+:8080).

upstream dineflow_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    # Reasonable upload ceiling for avatars / attachments
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Backend API ----
    location /api/ {
        proxy_pass         http://dineflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;

        # SignalR / WebSocket upgrade (order & cart hubs live under /api/hubs)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 100s;
    }

    # ---- Health probes ----
    location /health {
        proxy_pass       http://dineflow_backend;
        proxy_set_header Host $host;
    }

    # ---- User uploads served by the backend ----
    location /uploads/ {
        proxy_pass       http://dineflow_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ---- Avatar/menu images (stage: MinIO object store) ----
    # Served on the same domain so there is no separate api host. Uses a variable
    # proxy_pass + Docker's embedded DNS resolver so nginx still STARTS when there
    # is no `minio` service (e.g. the EC2 prod stack uses S3 and never hits this).
    location /dineflow-avatars-local/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # ---- SPA: everything else falls back to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; never cache index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# Map required so `Connection` is "upgrade" only for websocket requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
